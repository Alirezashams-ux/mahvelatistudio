<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIcademia · PLAP — M1 Offline Design Demo</title>
<style>
:root{--paper:#f7f6f2;--ink:#172329;--muted:#65716f;--blue:#3659e3;--jade:#147d68;--line:#e3e7e1}*{box-sizing:border-box}body{background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:var(--ink);margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.ribbon{background:#172329;color:#d2e9d9;padding:10px;text-align:center;font-size:10px;letter-spacing:.12em;font-weight:700}.shell{max-width:1230px;margin:auto;padding-left:28px;padding-right:28px}.top{border-bottom:1px solid var(--line);padding-top:24px;padding-bottom:24px;display:flex;align-items:center;gap:30px;flex-wrap:wrap}.brand{font-size:22px;letter-spacing:-.07em;font-weight:800;white-space:nowrap}.brand b{display:inline-grid;place-items:center;background:var(--blue);color:#fff;width:40px;height:40px;border-radius:10px;letter-spacing:-.1em;margin-right:8px}.nav{display:flex;flex-wrap:wrap;gap:5px}.nav button{background:none;border:0;border-radius:8px;padding:10px;color:#68736f;font-size:13px}.nav button.active{background:#e7edfa;color:var(--blue);font-weight:750}.lang{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:11px;font-size:12px;font-weight:700}.content{padding-top:68px;padding-bottom:100px;min-height:670px}.eyebrow{color:var(--jade);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.headline{font-size:clamp(43px,5.5vw,78px);line-height:1.06;letter-spacing:-.075em;max-width:800px;font-weight:630;margin:19px 0}.desc{max-width:650px;font-size:16px;line-height:1.7;color:var(--muted);margin-bottom:35px}.grid{display:grid;grid-template-columns:1.6fr 0.85fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:37px}.dark{background:#172b29;color:white;border-radius:13px;padding:37px;display:flex;flex-direction:column}.dark .eyebrow{color:#94dab8}.dark h2{font-size:clamp(29px,3vw,44px);line-height:1.15;letter-spacing:-.06em;font-weight:580;margin:90px 0 20px}.dark p{font-size:14px;line-height:1.7;color:#abc2b6}.panel h2{font-size:22px;letter-spacing:-.045em;line-height:1.3}.panel p{line-height:1.7;color:var(--muted)}.mission-box{border-top:1px solid var(--line);margin-top:42px;padding-top:25px}.day{font-size:22px;color:var(--blue);border:1px solid #d6dff8;border-radius:11px;display:inline-grid;place-items:center;width:51px;height:51px;margin-right:17px}.mission-title{display:inline-block;vertical-align:middle;max-width:80%}.mission-title strong{display:block;font-size:17px;margin-top:8px}.small{color:#88948e;font-size:11px;line-height:1.6}.button{border:0;background:var(--blue);color:#fff;border-radius:7px;font-weight:700;padding:16px 20px;margin-top:20px}.secondary{background:#eef0eb;color:var(--ink)}.link{border:0;background:transparent;color:var(--blue);font-weight:750;padding:12px;margin:0 10px}.formcard{background:#fff;border:1px solid var(--line);padding:38px;border-radius:13px;max-width:800px}.formcard label{display:block;font-size:13px;font-weight:720;margin:21px 0 9px}.formcard input,.formcard textarea{width:100%;border:1px solid #dce1d9;border-radius:7px;background:#fbfcfa;padding:14px;line-height:1.55}.formcard textarea{min-height:100px;resize:vertical}.alert{background:#eff3ea;border-left:3px solid var(--jade);padding:17px 20px;color:#587063;margin:25px 0;font-size:13px;line-height:1.6}.item{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px;border-bottom:1px solid var(--line);text-align:left}.item strong{font-size:14px}.item small{color:var(--muted)}.journey{max-width:750px;background:#fff;border:1px solid var(--line);border-radius:10px}.journey button{width:100%;border:0;border-bottom:1px solid var(--line);background:none}.journey button:hover{background:#f0f3fc}.stamp{display:inline-block;border:1px solid #a8bfb2;color:var(--jade);font-size:10px;padding:7px 10px;border-radius:20px;white-space:nowrap}.hidden{display:none}.footer{display:flex;justify-content:space-between;color:#98a29b;padding-bottom:30px;font-size:11px;border-top:1px solid var(--line);padding-top:25px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:45px}.three div{border-top:1px solid #bccabc;padding:20px 0}.three span{color:var(--jade)}.three strong{display:block;font-size:23px;letter-spacing:-.04em;margin-top:15px}.footnote{margin-top:25px;color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.dark h2{margin:25px 0}.three{grid-template-columns:1fr}.content{padding-top:40px}.panel{padding:24px}.formcard{padding:23px}.top{gap:14px}.nav{order:3;width:100%}.lang{margin-left:auto}.footer{display:block}}
</style></head><body>
<div class="ribbon">● &nbsp; INTERACTIVE OFFLINE CONCEPT · SYNTHETIC DATA · NO BACKEND</div>
<header class="shell top"><div class="brand"><b>a.</b> AIcademia</div><nav id="nav" class="nav" aria-label="Demo modes"></nav><button class="lang" id="lang">한국어 / EN</button></header>
<main class="shell content" id="app"></main><footer class="shell footer"><span>AIcademia / PLAP</span><span>M1 concept, not production software · No payments, real sessions or authentication</span></footer>
<script>
const KEY='aicademia-offline-m1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};
const state={lang:saved.lang||'en',mode:'today',day:saved.day||7,work:saved.work||[],admin:saved.admin||{en:'Make your email workflow reusable',ko:'이메일 작업을 재사용할 수 있게 만들기',when:'Friday 20:00 KST (sample only)'}};
const copy={en:{discover:'Discover',today:'Today',journey:'Journey',practice:'Practice',work:'My work',community:'Community',studio:'Dan Studio',title:'Make one useful thing today.',sub:'Progress is what you can reuse, not what you watched.',mission:'TODAY’S MISSION',start:'Begin today’s mission',lab:'Weekly community lab',principle:'THE IDEA',big:'Learn less at once. Remember more by doing.',small:'One task. One attempt. One piece of evidence. Repeat.',landing:'Less instruction. More actual capability.',landingSub:'PLAP is thirty small experiments that turn AI learning into reusable work.',practiceTitle:'Your practice desk.',task:'What are you trying to improve?',prompt:'Reusable prompt (no private information)',reflect:'What worked, and what must be checked?',save:'Save as self-reported workflow',name:'Workflow name',workTitle:'Your work. Your evidence.',empty:'No personal workflows yet. That is intentional.',q:'A weekly space for useful questions.',qtext:'Your question for Dan',qsave:'Save sample question',adminTitle:'Run the classroom, not the software.',edit:'Edit the sample Day 7 mission',saveAdmin:'Save local edit'},ko:{discover:'소개',today:'오늘',journey:'30일 여정',practice:'실습',work:'나의 작업',community:'커뮤니티',studio:'Dan 관리자',title:'오늘, 쓸모 있는 결과 하나를 만드세요.',sub:'진도는 본 영상이 아니라, 다시 활용할 수 있는 결과로 보여줍니다.',mission:'오늘의 미션',start:'오늘의 미션 시작',lab:'주간 커뮤니티 모임',principle:'핵심 원칙',big:'한 번에 적게 배우고, 직접 해 보며 오래 기억하세요.',small:'하나의 과제. 하나의 시도. 하나의 결과. 그리고 반복.',landing:'설명은 줄이고, 실제 역량은 키웁니다.',landingSub:'PLAP은 30일 동안 작은 실험을 통해 AI를 실제 업무에 적용합니다.',practiceTitle:'나만의 실습 공간.',task:'개선하고 싶은 업무는 무엇인가요?',prompt:'재사용할 프롬프트 (민감한 정보 제외)',reflect:'무엇이 효과적이었고 무엇을 확인해야 할까요?',save:'본인 작성 작업으로 저장',name:'작업 흐름 이름',workTitle:'나의 작업. 나의 경험.',empty:'아직 개인 작업 기록이 없습니다. 처음에는 비어 있는 것이 정상입니다.',q:'주 1회, 꼭 필요한 질문을 함께.',qtext:'Dan에게 물어볼 질문',qsave:'질문 예시 저장',adminTitle:'수업 운영은 쉽고 단순하게.',edit:'7일차 미션 수정',saveAdmin:'브라우저에 변경 저장'}};
const L=()=>copy[state.lang];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));
const modes=['discover','today','journey','practice','work','community','studio'];function go(m){state.mode=m;render();scrollTo(0,0)};
function render(){let t=L();document.documentElement.lang=state.lang;document.getElementById('nav').innerHTML=modes.map(m=>`<button class="${state.mode===m?'active':''}" onclick="go('${m}')">${t[m]}</button>`).join('');let html='';
if(state.mode==='today'){html=`<div class="eyebrow">YOUR SPACE / DAY ${String(state.day).padStart(2,'0')} / 30</div><p class="small">Prompt less. Accomplish more.</p><div class="grid"><section class="panel"><div class="small">PLAP / ${t.mission}</div><h1 class="headline">${t.title}</h1><p>${t.sub}</p><div class="mission-box"><span class="day">${String(state.day).padStart(2,'0')}</span><span class="mission-title"><span class="eyebrow">YOUR FOCUS</span><strong>${esc(state.lang==='en'?state.admin.en:state.admin.ko)}</strong></span><p class="small">15–20 MIN · USE ANY AI TOOL · SAMPLE CURRICULUM</p><button class="button" onclick="go('practice')">${t.start} ↗</button><button class="link" onclick="go('journey')">${t.journey} ↗</button></div></section><aside class="dark"><div class="eyebrow">${t.principle}</div><h2>✳<br>${t.big}</h2><p>${t.small}</p></aside></div><div class="item"><div><span class="eyebrow">UP NEXT</span><h3>${t.lab}</h3><small>${esc(state.admin.when)}</small></div><button class="link" onclick="go('community')">${t.community} ↗</button></div>`}
if(state.mode==='discover'){html=`<div class="eyebrow">PLAP / PROMPT LIKE A PRO</div><h1 class="headline">${t.landing}</h1><p class="desc">${t.landingSub}</p><button class="button" onclick="go('today')">${t.today} ↗</button><div class="three"><div><span>01</span><strong>Define the task.</strong></div><div><span>02</span><strong>Try it with your AI.</strong></div><div><span>03</span><strong>Keep what worked.</strong></div></div><p class="footnote">Course details, launch prices and curriculum await Dan's approval.</p>`}
if(state.mode==='journey'){html=`<div class="eyebrow">PLAP / 30 DAYS</div><h1 class="headline">Thirty days. One useful habit.</h1><p class="desc">Prototype missions — actual lesson content requires Dan's sign-off.</p><section class="journey">${Array.from({length:30},(_,i)=>`<button class="item" onclick="selectDay(${i+1})"><strong>${String(i+1).padStart(2,'0')} &nbsp; ${i===6?esc(state.lang==='en'?state.admin.en:state.admin.ko):['Define','Practice','Compare','Improve','Keep'][i%5]+' a useful AI workflow'}</strong><small>${state.day===i+1?'SELECTED':'OPEN ↗'}</small></button>`).join('')}</section>`}
if(state.mode==='practice'){html=`<div class="eyebrow">PLAP / BYOAI / DAY ${state.day}</div><h1 class="headline">${t.practiceTitle}</h1><p class="desc">Use your preferred AI tool outside this platform. Bring back a safe reflection, not real company data.</p><section class="formcard"><label>${t.name}</label><input id="workflow-name" placeholder="Polite email reply v1"><label>${t.task}</label><textarea id="workflow-task" placeholder="Use fictional or authorized information"></textarea><label>${t.prompt}</label><textarea id="workflow-prompt" placeholder="You are drafting a respectful email using a fictional case..."></textarea><label>${t.reflect}</label><textarea id="workflow-reflect" placeholder="What changed? What needs human review?"></textarea><button class="button" onclick="saveWork()">${t.save} ↗</button><p id="feedback" class="small"></p></section><p class="footnote">No AI integration · no grading · local-browser sample only</p>`}
if(state.mode==='work'){html=`<div class="eyebrow">PRIVATE WORKSPACE / DEMO</div><h1 class="headline">${t.workTitle}</h1><p class="desc">AI Passport is a proposed private portfolio, not an accredited credential.</p><section class="journey">${state.work.length?state.work.map(w=>`<div class="item"><div><strong>${esc(w.name)}</strong><p class="small">${esc(w.task)}</p><small>${esc(w.reflection)}</small></div><span class="stamp">SELF-REPORTED</span></div>`).join(''):`<div class="panel"><p>${t.empty}</p><button class="button" onclick="go('practice')">${t.practice} ↗</button></div>`}</section>`}
if(state.mode==='community'){html=`<div class="eyebrow">PLAP / COMMUNITY</div><h1 class="headline">${t.q}</h1><div class="grid"><div class="dark"><div class="eyebrow">${t.lab}</div><h2>${esc(state.admin.when)}</h2><p>Sample schedule. Dan will confirm the actual time and meeting link.</p></div><div class="formcard"><label>${t.qtext}</label><textarea id="community-question"></textarea><button class="button" onclick="saveQuestion()">${t.qsave} ↗</button><p id="feedback" class="small"></p><p class="footnote">Questions are only stored here; they are not sent to Dan.</p></div></div>`}
if(state.mode==='studio'){html=`<div class="eyebrow">OWNER DEMO / NO AUTHENTICATION</div><h1 class="headline">${t.adminTitle}</h1><div class="alert">This route is a design demonstration, not secured production administration. All edits remain in this browser.</div><section class="formcard"><h2>${t.edit}</h2><label>Title (English)</label><input id="admin-en" value="${esc(state.admin.en)}"><label>Title (Korean)</label><input id="admin-ko" value="${esc(state.admin.ko)}"><label>Weekly session time (sample)</label><input id="admin-when" value="${esc(state.admin.when)}"><button class="button" onclick="saveAdmin()">${t.saveAdmin} ↗</button></section>`}
 document.getElementById('app').innerHTML=html}
function selectDay(n){state.day=n;persist();go('today')};function saveWork(){let name=document.getElementById('workflow-name').value.trim(),task=document.getElementById('workflow-task').value.trim(),reflection=document.getElementById('workflow-reflect').value.trim();if(!name||!task||!reflection){document.getElementById('feedback').textContent='Title, task and reflection required.';return}state.work.unshift({name,task,reflection,prompt:document.getElementById('workflow-prompt').value});persist();go('work')}
function saveQuestion(){let q=document.getElementById('community-question').value.trim();document.getElementById('feedback').textContent=q?'Saved locally as a demo question.':'Please enter a question.'}
function saveAdmin(){state.admin={en:document.getElementById('admin-en').value,ko:document.getElementById('admin-ko').value,when:document.getElementById('admin-when').value};persist();go('today')}
document.getElementById('lang').onclick=()=>{state.lang=state.lang==='en'?'ko':'en';persist();render()};render();
</script></body></html>
